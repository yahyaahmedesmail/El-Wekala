services:
  postgres:
    image: postgres:16-alpine
    container_name: el-wekala-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elwekala
      POSTGRES_PASSWORD: elwekala
      POSTGRES_DB: el_wekala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elwekala -d el_wekala"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
